<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Yours AI</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-screen{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#0b0d12;padding:20px}.auth-screen[hidden]{display:none}.auth-card{width:min(420px,100%);padding:28px;background:#141923;border:1px solid #303745;border-radius:16px;box-shadow:0 20px 60px #0008}.auth-card input{width:100%;margin:6px 0;padding:12px;border:1px solid #303745;border-radius:9px;background:#0f131b;color:#fff}.auth-tabs{display:flex;gap:14px;margin:18px 0;border-bottom:1px solid #303745}.auth-tabs button{border:0;background:none;color:#8f98a8;padding:10px 0;cursor:pointer}.auth-tabs button.active{color:#fff;border-bottom:2px solid #26c6da}.error-text{color:#ff8e8e;min-height:20px}.user-info{font-size:12px;color:#aeb7c7;padding:9px 5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chat-row{display:flex;gap:3px;align-items:center}.chat-row .chat-item{flex:1}.chat-action{border:0;background:transparent;color:#8f98a8;cursor:pointer;padding:8px}.tool-btn,.stop-btn{border:1px solid #303745;background:#181c24;color:#aeb7c7;border-radius:8px;padding:8px;cursor:pointer}.tool-btn.selected{border-color:#26c6da;color:#fff}.stop-btn{color:#ff9b9b}.sources{display:block;color:#7fd7df;margin-top:8px}.image-preview{display:flex;align-items:center;gap:10px;padding:8px}.image-preview[hidden]{display:none}.image-preview img,.message-image{max-width:160px;max-height:120px;border-radius:8px}.image-preview button{border:0;background:transparent;color:#ff9b9b;cursor:pointer}.code-block{position:relative;margin:8px 0;padding:10px;background:#0a0d12;border:1px solid #303745;border-radius:8px}.code-block>span{color:#7fd7df;font-size:11px}.code-block button{float:right;border:1px solid #303745;background:transparent;color:#aeb7c7;border-radius:6px;padding:3px 7px;cursor:pointer}.code-block pre{overflow:auto;margin:8px 0 0}.code-block code{white-space:pre}dialog{background:#141923;color:#fff;border:1px solid #303745;border-radius:12px;padding:22px}dialog form{display:grid;gap:14px}dialog::backdrop{background:#0009}
  </style>
</head>
<body>
  <section id="authScreen" class="auth-screen">
    <div class="auth-card">
      <div class="brand"><div class="logo">✦</div><div><strong>Yours AI</strong><span>Private local AI workspace</span></div></div>
      <div class="auth-tabs"><button id="loginTab" class="active">Sign in</button><button id="registerTab">Create account</button></div>
      <form id="authForm">
        <input id="authName" type="text" placeholder="Name" autocomplete="name" hidden>
        <input id="authEmail" type="email" placeholder="Email" autocomplete="email" required>
        <input id="authPassword" type="password" placeholder="Password (8+ characters)" autocomplete="current-password" minlength="8" required>
        <button class="new-chat" type="submit" id="authSubmit">Sign in</button>
        <p id="authError" class="error-text"></p>
      </form>
    </div>
  </section>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo">✦</div>
        <div>
          <strong>Yours AI</strong>
          <span>Ollama AI</span>
        </div>
      </div>

      <button id="newChat" class="new-chat">＋ New chat</button>

      <div class="side-title">Recent chats</div>
      <div id="chatList" class="chat-list"></div>

      <div class="sidebar-bottom">
        <div id="userInfo" class="user-info"></div>
        <label class="side-title" for="model">AI model</label>
        <select id="model">
          <option value="">Loading models…</option>
        </select>
        <button id="themeBtn" class="ghost">☾ Toggle theme</button>
        <button id="settingsBtn" class="ghost">⚙ Settings</button>
        <button id="logoutBtn" class="ghost">↪ Log out</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button id="mobileMenu" class="icon-btn">☰</button>
        <div>
          <h1 id="chatTitle">New chat</h1>
          <p>Private local AI workspace</p>
        </div>
        <div class="top-actions">
          <label class="upload-btn">
            <input id="fileInput" type="file" accept=".txt,.md,.pdf,.docx,.csv,.json,.jpg,.jpeg,.png,.webp,.gif,.bmp,.tif,.tiff,.svg,.heic,.heif,.ico,.avif,image/*">
            Upload file
          </label>
          <label class="upload-btn" title="Attach image">
            <input id="imageInput" type="file" multiple accept=".jpg,.jpeg,.png,.webp,.gif,.bmp,.tif,.tiff,.svg,.heic,.heif,.ico,.avif,image/*">
            Image
          </label>
          <button id="voiceBtn" class="icon-btn" title="Voice input">◉</button>
          <button id="clearBtn" class="icon-btn" title="Clear chat">⌫</button>
        </div>
      </header>

      <section id="messages" class="messages">
        <div class="welcome">
          <div class="welcome-icon">✦</div>
          <h2>How can I help?</h2>
          <p>Your AI runs locally through Ollama.</p>
          <div class="suggestions">
            <button data-prompt="Explain Python loops simply with examples.">Explain Python loops</button>
            <button data-prompt="Help me plan an AI/ML project.">Plan an AI project</button>
            <button data-prompt="Teach me SQL from beginner to advanced.">Teach me SQL</button>
            <button data-prompt="Give me a DSA practice problem in Python.">Practice DSA</button>
          </div>
        </div>
      </section>

      <footer class="composer-wrap">
        <div id="fileStatus" class="file-status"></div>
        <div id="imagePreview" class="image-preview" hidden><img id="previewImage" alt="Selected image"><span id="imageDetails"></span><button id="downloadImage" type="button" hidden>Download</button><button id="removeImage" type="button">Remove image</button></div>
        <div class="composer">
          <button id="searchBtn" class="tool-btn" type="button">Web search</button>
          <button id="codingBtn" class="tool-btn" type="button">Coding</button>
          <button id="createImageBtn" class="tool-btn" type="button">Create image</button>
          <textarea id="prompt" rows="1" placeholder="Message Yours AI…"></textarea>
          <button id="sendBtn" class="send">➤</button>
          <button id="stopBtn" class="stop-btn" type="button" hidden>Stop</button>
        </div>
        <div class="composer-note">Yours AI can make mistakes. Verify important information.</div>
      </footer>
    </main>
  </div>
  <dialog id="settingsDialog"><form method="dialog"><h2>Settings</h2><label>Theme <select id="settingsTheme"><option value="dark">Dark</option><option value="light">Light</option></select></label><label><input id="settingsSearch" type="checkbox"> Enable web search</label><label><input id="settingsCoding" type="checkbox"> Coding mode</label><button class="new-chat">Close</button></form></dialog>
  <script src="app.js"></script>
</body>
</html>
